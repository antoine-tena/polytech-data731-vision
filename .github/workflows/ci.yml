name: CI

# The reusable workflows live in kiln (antoine-tena/kiln, public), cited at the kiln release the
# project comes from (develop): `kiln update` moves them to the next one. The project only
# keeps its parameters here.
on:
  # Only on the way to main: a release branch. A merge into develop runs fast linters only.
  push:
    branches: [ "release/**" ]
  # Callable from another workflow of the repo.
  workflow_call:

# [WORKFLOW-PERMISSIONS]: the token reads the repo, nothing more; kiln's workflows need no more.
permissions:
  contents: read

jobs:
  backend:
    uses: antoine-tena/kiln/.github/workflows/python.yml@ced9807bea3e60e5682f2bec2e3afb26627658a7 # develop
    with:
      directory: backend

  frontend:
    uses: antoine-tena/kiln/.github/workflows/python.yml@ced9807bea3e60e5682f2bec2e3afb26627658a7 # develop
    with:
      directory: frontend

  charter:
    uses: antoine-tena/kiln/.github/workflows/charter.yml@ced9807bea3e60e5682f2bec2e3afb26627658a7 # develop

  # [SECRETS]: gitleaks searches the whole history, with no organisation licence.
  secrets-scan:
    uses: antoine-tena/kiln/.github/workflows/secrets.yml@ced9807bea3e60e5682f2bec2e3afb26627658a7 # develop

  security:
    uses: antoine-tena/kiln/.github/workflows/security.yml@ced9807bea3e60e5682f2bec2e3afb26627658a7 # develop
    with:
      uv: "backend frontend"
      pnpm: ""

  containers:
    uses: antoine-tena/kiln/.github/workflows/infra.yml@ced9807bea3e60e5682f2bec2e3afb26627658a7 # develop
    with:
      containerfiles: "backend/Containerfile frontend/Containerfile"
      compose: compose.yaml
