[project]
name = "vision-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "marimo>=0.25.1,<0.26.0",
    "numpy>=2.5.3,<3.0.0",
    "pillow>=12.3.0,<13.0.0",
    "plotly>=7.1.0,<8.0.0",
    "polars>=2.0.0,<3.0.0",
    "structlog>=26.1.0,<27.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["network", "pipeline"]

[dependency-groups]
dev = [
    "mypy>=2.4.0,<3.0.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "ruff>=0.17.2,<0.18.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"
# marimo notebooks are Python files written by the editor ([NOTEBOOKS]).
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ANN"]

[tool.mypy]
strict = true
exclude = ["notebooks/"]

# Plotly ships no types.
[[tool.mypy.overrides]]
module = ["plotly", "plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["network", "pipeline"]
