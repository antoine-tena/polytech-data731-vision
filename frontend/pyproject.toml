[project]
name = "vision-frontend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "vision-backend",
    "streamlit>=1.65.0,<2.0.0",
]

# The backend's data chain, imported as is ([COMPUTE-OUTSIDE-UI]).
[tool.uv.sources]
vision-backend = { path = "../backend", editable = true }

[dependency-groups]
dev = [
    "mypy>=2.4.0,<3.0.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "ruff>=0.17.2,<0.18.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ANN"]

[tool.mypy]
strict = true

# Plotly ships no types.
[[tool.mypy.overrides]]
module = ["plotly", "plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["dashboard"]
